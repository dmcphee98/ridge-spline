<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/ridge-spline/favicon.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Ridge Spline</title>
        <script>
            // The theme and accent kept from the last visit, set before the page draws so it never shows in the others
            // first (see src/editor/ui/useTheme.ts and useAccent.ts). An unknown accent shows as the default.
            try {
                const root = document.documentElement;
                const theme = JSON.parse(localStorage.getItem("mountain-generator:theme"));
                if (theme === "light" || theme === "dark") root.dataset.theme = theme;
                const accent = JSON.parse(localStorage.getItem("mountain-generator:accent"));
                if (typeof accent === "string") root.dataset.accent = accent;
            } catch {}
        </script>
        <link rel="preconnect" href="https://fonts.googleapis.com" />

            rel="stylesheet"
        />

      <link rel="stylesheet" crossorigin href="/ridge-spline/assets/index-CcNSnAo1.css">
